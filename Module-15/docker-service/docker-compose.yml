services:
  product-db:
    image: postgres:16
    container_name: product-db
    restart: always

    environment:
      POSTGRES_DB: product-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Ajay@9977

    ports:
      - "5432:5432"

    volumes:
      - product-db-data:/var/lib/postgresql/data

    networks:
      - myNetwork

  product-service:
    build: .

    image: ajay5529/docker-service:latest

    container_name: product-service

    restart: always

    depends_on:
      - product-db

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/product-db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Ajay@9977

    networks:
      - myNetwork

volumes:
  product-db-data:

networks:
  myNetwork:


